name: rw-art-community-bots

services:
  emp:
    build: .
    restart: unless-stopped
    env_file: .env.emp
    environment:
      - BOT_INSTANCE=emp
    volumes:
      - emp-data:/app/data

  scava:
    build: .
    restart: unless-stopped
    env_file: .env.scava
    environment:
      - BOT_INSTANCE=scava
    volumes:
      - scava-data:/app/data

volumes:
  emp-data:
  scava-data:
